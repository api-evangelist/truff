apis:
- aid: truff-ucp-shopping-mcp
  name: TRUFF Store UCP Shopping API
  description: >-
    The agent-facing commerce surface for TRUFF's online store. A Model Context Protocol endpoint at
    https://shop.truff.com/api/ucp/mcp implements the Universal Commerce Protocol dev.ucp.shopping
    service (version 2026-08-25, with 2026-04-08 and 2026-01-23 still supported) and answers
    unauthenticated with 13 tools covering catalog search and lookup, product detail, cart create /
    read / update / cancel, checkout create / read / update / complete / cancel, and order lookup.
    complete_checkout requires an idempotency key and, per the store's published agent instructions,
    contemporaneous buyer approval before payment. The implementation is emitted by the Shopify
    platform for every store on it; the endpoint, the merchant identity and the data are TRUFF's.
  humanURL: https://shop.truff.com/llms.txt
  baseURL: https://shop.truff.com/api/ucp/mcp
