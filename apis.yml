aid: truff
name: TRUFF
description: >-
  TRUFF is a Los Angeles-based luxury condiments company founded in 2017 by Nick Ajluni and Nick
  Guillen, known for its black-truffle-infused hot sauce and a pantry line that has grown to include
  truffle oil, pasta sauce, aioli, mayonnaise and salt. The brand began as a digitally-native
  direct-to-consumer business selling through its own storefront at truff.com and has since expanded
  into a multichannel food business carried in more than 20,000 retail stores including Whole Foods,
  Kroger, Publix and Target, alongside foodservice collaborations with restaurant chains. SKKY
  Partners took a significant minority stake in the company in November 2023. TRUFF is a consumer
  packaged goods manufacturer, not a software vendor: it publishes no developer portal, no OpenAPI,
  no SDKs and issues no API keys. It does, however, expose a live and completely unauthenticated
  agent commerce surface at shop.truff.com — a Universal Commerce Protocol (UCP) shopping service
  reachable over MCP, advertised in the store's own llms.txt and /.well-known/ucp, through which an
  agent can search the catalog, build a cart and complete a purchase. That surface is Shopify's
  platform-native UCP implementation running under TRUFF's merchant identity rather than something
  TRUFF engineered, and it is recorded here with that provenance.
