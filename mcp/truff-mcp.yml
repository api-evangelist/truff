- name: create_checkout
  category: checkout
  description: Creates a checkout; returns line items, totals, discounts and taxes.
  write: true
- name: get_checkout
  category: checkout
  description: Returns details about the checkout.
  write: false
- name: update_checkout
  category: checkout
  description: Updates a checkout (shipping address, method, buyer details).
  write: true
- name: complete_checkout
  category: checkout
