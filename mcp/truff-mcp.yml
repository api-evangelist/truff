  write: false
- name: create_cart
  category: cart
  description: Creates a new cart.
  write: true
- name: get_cart
  category: cart
  description: Get the cart contents.
  write: false
- name: update_cart
  category: cart
  description: Perform updates to a cart.
  write: true
- name: cancel_cart
  category: cart
  description: Cancels a cart.
  write: true
