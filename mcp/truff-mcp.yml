payment_handlers:
- id: gpay
  handler: com.google.pay
  merchant_name: TRUFF
  merchant_origin: shop.truff.com
- id: shopify.card
  handler: dev.shopify.card
  card_brands: [visa, master, american_express, discover, diners_club]
- id: shop_pay
  handler: dev.shopify.shop_pay
guardrails:
- >-
  Checkout requires contemporaneous human approval. The published agent instructions state an
  agent must not complete payment without explicit buyer consent.
- The MCP endpoint is rate-limited per IP; back off on 429.
- >-
  Every tool requires meta.ucp-agent.profile — a URI identifying the calling agent — so calls
  are attributable.
