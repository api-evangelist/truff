guardrails:
- Checkout requires contemporaneous human approval. The published agent instructions state an agent must
  not complete payment without explicit buyer consent.
- The MCP endpoint is rate-limited per IP; back off on 429.
- Every tool requires meta.ucp-agent.profile — a URI identifying the calling agent — so calls are attributable.
