name: TRUFF Store — UCP Shopping MCP
description: A live, unauthenticated Model Context Protocol endpoint on TRUFF's own storefront host that
  exposes the store's catalog, cart, checkout and order surface to agents. It is the Shopify platform's
  native Universal Commerce Protocol (UCP) shopping service — TRUFF did not author the tool schemas —
  but the endpoint is served from a TRUFF-controlled host, the UCP merchant profile names TRUFF as the
  merchant (merchant_origin shop.truff.com, Shopify shop id 21822603), and every tool operates on TRUFF's
  own catalog and carts. Recorded as a real agent surface with platform-provided provenance.
status: live
ownership: Platform-provided, merchant-scoped. Shopify emits the UCP/MCP implementation for every store
  on the platform; the endpoint, the merchant identity and the data behind it are TRUFF's. This is the
  templated/self-hosted case, not a sibling-product misattribution — the profile at /.well-known/ucp names
  merchant "TRUFF" and no other brand.
