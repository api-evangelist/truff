    gated: false
    documented_at: https://shop.truff.com/llms.txt
    note: Shopify storefront JSON endpoints, documented by TRUFF's own agent instructions.
crosswalk:
- tool: search_catalog
  category: catalog
  rest:
  - GET /search?q={query}&type=product
  binding: path
  confidence: medium
  note: >-
    Both search TRUFF's product catalog, but the REST form returns a storefront search page
    payload and the tool returns UCP catalog objects. Not field-for-field equivalent.
- tool: lookup_catalog
  category: catalog
  rest:
  - GET /products.json
  - GET /collections/{handle}/products.json
  binding: path
  confidence: medium
  note: >-
    GET https://shop.truff.com/products.json?limit=3 returned HTTP 200 on 2026-08-30. Bulk
    product retrieval by identifier maps to these collection listings only approximately.
- tool: get_product
  category: catalog
  rest:
  - GET /products/{handle}.json
  binding: path
  confidence: high
  note: Single-product detail by identifier; closest one-to-one pairing on the surface.
