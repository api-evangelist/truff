note: >-
  TRUFF publishes no OpenAPI, so the REST side of this crosswalk binds to documented URL
  PATHS rather than to operationIds. Nothing here is invented: every path on the right-hand
  side is one llms.txt names, and the two that were probed are marked with their status.
  Confidence is set accordingly.
surfaces:
